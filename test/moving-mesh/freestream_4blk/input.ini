; Written by test/tools/split_blocks.py from test/moving-mesh/freestream, cut into 2 x 2 blocks (only its FUSS sections are kept).

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
iter-threshold = 300

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = prescribed
amp = 1.0e-3 8.0e-4 0.0
kx  = 31.0 13.0 0.0
ky  = 17.0 23.0 0.0
kz  = 0.0  0.0  0.0
omega = 0.01
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 300
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000
