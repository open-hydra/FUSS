; =============================================================================
;  Receding conjugate two-layer slab  (plan 08 section 2.3 R5, stage B)
;
;  The conjugate_two_layer geometry (dx2/dx1 4 across the block interface, k 50 and 5) with
;  block 1's hot end an ablating wall BC 306 in kinematic mode that recedes at the TEST ONLY
;  sdot-override of 1e-5 m/s (law nodeshift); block 2 stays put. Oracle: the two sides of
;  every 101 face put opposite fluxes into the residual (interface-flux.txt, verify.py).
;
;  Generated by generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 200

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 1e-05
dump-interface-flux = true

[FUSS-IO]
sol-diter     = 50
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000
