; =============================================================================
;  Free-stream preservation on a moving mesh  (plan 05, gate 5.1)
;
;  A uniform temperature field, every wall adiabatic, no volumetric source, and
;  an arbitrary prescribed mesh motion. With no forcing of any kind the only
;  thing that can change T is an error in the ALE / Geometric Conservation Law
;  machinery, so T must stay exactly uniform.
;
;  This is the single most diagnostic test in the moving-mesh phase: a GCL
;  violation shows up as a steady drift that grows with mesh velocity, and it
;  does NOT vanish under grid refinement.
;
;  The motion is deliberately awkward -- three-dimensional in form, different
;  wavenumbers and phases per component, and not aligned with any single
;  computational direction -- so that a bug which happens to cancel for
;  axis-aligned stretching cannot survive it. The z amplitude is zero because
;  the mesh is 2-D and its k direction is degenerate.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
iter-threshold = 300

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = prescribed
amp = 1.0e-3 8.0e-4 0.0
kx  = 31.0 13.0 0.0
ky  = 17.0 23.0 0.0
kz  = 0.0  0.0  0.0
omega = 0.01
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 300
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.6
height = 0.4
nx = 60
ny = 40
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = mat
cp  = 460.0
rho = 7850.0
k   = 52.0
Tmax = 2000

;

[ICB-Block1]
type = homogeneous
material = mat
T = 273.15

;

[BCB-Block1]
face1 = Wadiabatic
face2 = Wadiabatic
face3 = Wadiabatic
face4 = Wadiabatic
face5 = null
face6 = null

[Wadiabatic]
type = wall
q = 0.0
