; =============================================================================
;  Energy conservation on a moving mesh  (plan 05, gate 5.4)
;
;  A strongly NON-uniform temperature field (a 400 K hot spot on a 273 K plate),
;  adiabatic walls, no volumetric source, and vigorous INTERIOR mesh motion.
;
;  `taper-to-boundary` pins the nodes on the domain boundary, so the domain
;  neither gains nor loses material. Every ALE flux is then internal, and total
;  energy must be conserved exactly: the swept-volume contributions of the two
;  cells sharing a face are equal and opposite and cancel in the global sum.
;
;  WHY THIS TEST EXISTS SEPARATELY FROM 5.1
;  ---------------------------------------
;  Free-stream preservation (5.1) uses a UNIFORM field, so every candidate face
;  value -- upwind, centred, or the cell's own -- gives the same answer and the
;  test cannot tell them apart. Conservation can: only an upwind face value
;  chosen on the SIGN of the swept volume makes the two sides of a face agree,
;  and therefore telescope. A centred average passes 5.1 and fails here.
;
;  Conduction redistributes energy but does not create or destroy it, so the
;  expected result is exact conservation, not conservation to some tolerance.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
iter-threshold = 300

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = prescribed
taper-to-boundary = true
amp = 2.0e-3 1.6e-3 0.0
kx  = 31.0 13.0 0.0
ky  = 17.0 23.0 0.0
kz  = 0.0  0.0  0.0
omega = 0.02
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 300
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.6
height = 0.4
nx = 60
ny = 40
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = mat
cp  = 460.0
rho = 7850.0
k   = 52.0
Tmax = 2000

;

[ICB-Block1]
type = homogeneous
material = mat
T = 273.15

;

[BCB-Block1]
face1 = Wadiabatic
face2 = Wadiabatic
face3 = Wadiabatic
face4 = Wadiabatic
face5 = null
face6 = null

[Wadiabatic]
type = wall
q = 0.0
