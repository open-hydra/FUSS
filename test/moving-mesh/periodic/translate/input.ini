[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 200

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.25
time-accurate = true
integration-variables = cons

[FUSS-MeshMotion]
law = translation
vel = 2.0e-3 0.0 0.0
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 200
sol-overwrite = true
sol-format    = tecplot ascii
res-diter = 1
shell-diter = 50
ini-diter = 100000000
