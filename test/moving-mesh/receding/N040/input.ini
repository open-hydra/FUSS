; =============================================================================
;  Receding-surface conduction, 40 cells across the slab  (plan 05, gate 5.3)
;
;  Generated by ../generate.py -- edit that, not this.
;
;  The mesh translates rigidly at v = 1.440044309E-03 m/s, so the problem is steady in
;  the mesh frame and the oracle is the closed-form profile
;
;      T(xi) = Tinf + (Tw - Tinf) [exp(-xi/d) - exp(-L/d)] / [1 - exp(-L/d)]
;
;  with d = alpha/v = 0.01 m. See ../verify.py for what is measured and why
;  the expected order is ONE, not two: the ALE remap upwinds on the sign of the
;  swept volume, which under rigid translation is exactly first-order upwind
;  advection.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 200.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = translation
vel = 1.440044309E-03 0.0 0.0
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.1
height = 0.02
nx = 40
ny = 4
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = mat
cp  = 460.0
rho = 7850.0
k   = 52.0
Tmax = 2000

;

[ICB-Block1]
type = homogeneous
material = mat
T = 273.15

;

[BCB-Block1]
face1 = Tsurface
face2 = Tfarfield
face3 = Wadiabatic
face4 = Wadiabatic
face5 = null
face6 = null

[Tsurface]
type = wall
T = 1273.15

[Tfarfield]
type = wall
T = 273.15

[Wadiabatic]
type = wall
q = 0.0
