; Written by test/tools/split_blocks.py from test/moving-mesh/receding/N080, cut into 4 x 1 blocks (only its FUSS sections are kept).

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 200.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = translation
vel = 1.440044309E-03 0.0 0.0
gcl-tolerance = 1.0e-10

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
