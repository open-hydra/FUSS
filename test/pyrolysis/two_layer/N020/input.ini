; =============================================================================
;  Two-material slab in one block (k ratio 20), no kinetics, constant properties: the composite-slab
;  heat equation, exact solution tools/two_layer_exact.py. 20 equal cells, the jump at face 10.
;  Face 1 adiabatic (301), face 2 at 1000 K from t = 0 (302), T(0) = 300 K.
;  Gas closure type1.
;
;  Generated by test/pyrolysis/tools/make_two_layer.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 8.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.05
time-accurate = true
integration-variables = cons

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 2.0
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
