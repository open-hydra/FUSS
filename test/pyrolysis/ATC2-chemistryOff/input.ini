; =============================================================================
;  Ablation Test Case 2, chemistry off  (plan 06, gate 4.5; oracle a local PATO run)
;
;  Mesh and tables as ATC1; T(0) at 300 K; face 2 is the closed-form Robin wall BC 303 with
;  hconv 300 W/m2/K, qrad 0, Tref 2800 K from t equal 0 (PATO run with zero emissivity).
;  Two probes bracket each PATO probe depth (see probes.json).
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 60.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 10.0
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = d01lo
probe2 = d01hi
probe3 = d02lo
probe4 = d02hi
probe5 = d04lo
probe6 = d04hi
probe7 = d08lo
probe8 = d08hi
probe9 = d12lo
probe10 = d12hi
probe11 = d16lo
probe12 = d16hi
probe13 = d24lo
probe14 = d24hi
probe15 = back

[d01lo]
