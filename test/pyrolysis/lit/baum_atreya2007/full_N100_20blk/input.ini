; Written by test/tools/split_blocks.py from test/pyrolysis/lit/baum_atreya2007/full_N100, cut into 20 x 1 blocks (only its FUSS sections are kept).

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 300
iter-threshold = 1000000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-12
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
open-bc-types = 302
quasi-steady = false

[FUSS-IO]
sol-dtime     = 10
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 1000000000

[FUSS-Probes]
probe1 = back
probe2 = surf
probe3 = x05
probe4 = x10
probe5 = x20

[back]
index-position = 20 5 1 1
variables = T p_pg
dtime = 0.05

[surf]
index-position = 1 1 1 1
variables = T p_pg
dtime = 0.05

[x05]
index-position = 1 2 1 1
variables = T p_pg
dtime = 0.05

[x10]
index-position = 1 3 1 1
variables = T p_pg
dtime = 0.05

[x20]
index-position = 2 1 1 1
variables = T p_pg
dtime = 0.05
