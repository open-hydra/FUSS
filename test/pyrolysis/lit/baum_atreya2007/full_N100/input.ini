; =============================================================================
;  Baum & Atreya 2007 sharp-front charring + Darcy (corrected front condition), Di Blasi set
;  100 cells over 40 mm, surface 1298.16 K (302, open at p_s), T0 298.16 K, zeroth-order decomposition from Tp 598.16 K,
;  A 0.0329806 /s (one cell per crossing time at 100 s); c_g 1475; K_c 1e-15; gas storage (eps_c 0.76); C* = 0.388580
;
;  Generated by test/pyrolysis/tools/make_baum_atreya.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 300
iter-threshold = 1000000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-12
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
open-bc-types = 302
quasi-steady = false

[FUSS-IO]
sol-dtime     = 10
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 1000000000

[FUSS-Probes]
probe1 = back
probe2 = surf
probe3 = x05
probe4 = x10
probe5 = x20

[back]
index-position = 1 100 1 1
variables = T p_pg
dtime = 0.05

[surf]
index-position = 1 1 1 1
variables = T p_pg
dtime = 0.05

[x05]
index-position = 1 2 1 1
variables = T p_pg
dtime = 0.05

[x10]
index-position = 1 3 1 1
variables = T p_pg
dtime = 0.05

[x20]
index-position = 1 6 1 1
variables = T p_pg
dtime = 0.05
