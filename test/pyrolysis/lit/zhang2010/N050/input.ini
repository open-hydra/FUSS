; =============================================================================
;  Zhang 2010 Table 2.1 decomposing slab (three-code verification), Henderson-form energy equation
;  50 cells over 12.7 mm; exposed face 305 (h 10, eps 1, Tref 773.224566 = q_rad 25 kW/m2 + h (300 - T) - sigma T^4),
;  back face adiabatic; rho 1700 -> 1255, A 5e28, E 3.62e5, n 4.6; Q -2e5 J/kg at Tref 273 K; Cp 1100, Cg 3000, k 0.30
;
;  Generated by test/pyrolysis/tools/make_zhang2010.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 2000
iter-threshold = 1000000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = -i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 10
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 1000000000

[FUSS-Probes]
probe1 = front
probe2 = midlo
probe3 = midhi
probe4 = back

[front]
index-position = 1 1 1 1
variables = T
dtime = 1

[midlo]
index-position = 1 25 1 1
variables = T
dtime = 1

[midhi]
index-position = 1 26 1 1
variables = T
dtime = 1

[back]
index-position = 1 50 1 1
variables = T
dtime = 1
