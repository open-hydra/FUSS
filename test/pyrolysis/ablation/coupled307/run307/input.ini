; =============================================================================
;  The coupled ablating wall BC 307 standalone (plan 08 sections 2.5 ii, 3.5 ii): run307/ and run306/ solve ONE
;  problem through two input paths -- the 307 exchange values from the TEST ONLY coupled-env-file, the same values
;  as a 306 env table with lambda 0 -- and must agree byte for byte.
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-IO]
sol-dtime     = 0.25
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = d01lo
probe2 = d01hi
probe3 = d02lo
probe4 = d02hi
probe5 = d04lo
probe6 = d04hi
probe7 = d08lo
probe8 = d08hi
probe9 = d12lo
probe10 = d12hi
probe11 = d16lo
probe12 = d16hi
probe13 = d24lo
probe14 = d24hi
probe15 = back

[d01lo]
