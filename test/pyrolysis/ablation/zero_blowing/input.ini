; =============================================================================
;  Ablation Test Case 2.1, chemistry on  (plan 08 section 3.3; oracle a local PATO run)
;
;  Mesh and tables as ATC2-chemistryOff; T(0) at 300 K; face 2 is the ablating wall BC 306, the
;  surface energy balance with the equilibrium B' table INPUT/bprime_tacot_earth.dat and PATO's
;  boundary conditions as the time table INPUT/env_atc21.dat; lambda 0.0, T_inf 300 K.
;  Static mesh, no-char true: the char is not consumed (PATO with movingMesh no).
;  Two probes bracket each PATO probe depth (see probes.json). seb.txt rows every 0.1 s.
;
;  Type-2 gas closure (plan 07): the gas pressure is solved ([FUSS-Darcy]), the gas storage
;  eps_pg (rho_g h_g - p) is in E, the gas leaves through the open faces at p-wall.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 2.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-Ablation]
no-char = true

[FUSS-IO]
sol-dtime     = 0.1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = d01lo
probe2 = d01hi
probe3 = d02lo
probe4 = d02hi
probe5 = d04lo
probe6 = d04hi
probe7 = d08lo
probe8 = d08hi
probe9 = d12lo
probe10 = d12hi
probe11 = d16lo
probe12 = d16hi
probe13 = d24lo
probe14 = d24hi
probe15 = back

[d01lo]
index-position = 1 93 1 1
variables = T p_pg
dtime = 0.1

[d01hi]
