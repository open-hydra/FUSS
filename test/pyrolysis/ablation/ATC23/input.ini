; =============================================================================
;  Ablation Test Case 2.3, chemistry on  (plan 08 section 3.3; oracle a local PATO run)
;
;  Mesh and tables as ATC2-chemistryOff; T(0) at 300 K; face 2 is the ablating wall BC 306, the
;  surface energy balance with the equilibrium B' table INPUT/bprime_tacot_earth.dat and PATO's
;  boundary conditions as the time table INPUT/env_atc23.dat; lambda 0.5, T_inf 300 K.
;  Receding mesh, law nodeshift: the char is consumed at the rate of the B' table (PATO with movingMesh yes).
;  No index probes (a probe is a cell and every cell moves): verify.py samples the field files. A field file every 0.1 s (the fronts).
;
;  Type-2 gas closure (plan 07): the gas pressure is solved ([FUSS-Darcy]), the gas storage
;  eps_pg (rho_g h_g - p) is in E, the gas leaves through the open faces at p-wall.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 120.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-IO]
sol-dtime     = 0.1
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
