; =============================================================================
;  Ablating-wall guard demo base, two blocks  (plan 08 section 2.10; test/run_guard_demos.sh)
;
;  Two blocks: 4 x 4 cells over 0.02 m and, beside it, 4 x 8 over 0.02 x 0.04 m; block 1's
;  outer face is the ablating wall BC 306.
;  kinematic mode (no pyrolysis): legacy material k 1, rho 1000, cp 1000; chemistry off;
;  the face recedes at the TEST ONLY sdot-override of 1e-5 m/s (law nodeshift).
;  5 steps. The demos edit a copy; this base itself runs to completion.
;
;  Generated by test/pyrolysis/tools/make_abl_demo_base.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 5

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.3
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
seb-tol = 1.0e-8
sdot-override = 1.0e-5

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
