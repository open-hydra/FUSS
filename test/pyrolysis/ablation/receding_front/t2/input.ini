; =============================================================================
;  Receding front, type-2 closure: the swept energy and gas follow (T_w, p_w)
;  (plan 12 section D, P-D3's exact case)
;
;  front under the type-2 closure, K = 1e-12 m2, p-init = p_w = 101325 Pa; 20 steps with a
;  field file each (the surface cell's eta_st per step).
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 20

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-08
p-init = 101325.0
p-wall = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 0.0014285714285714286

[FUSS-IO]
sol-diter     = 1
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
