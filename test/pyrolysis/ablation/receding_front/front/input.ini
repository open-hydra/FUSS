; =============================================================================
;  Receding front under a constant absorbed flux: T_w* = T_inf + q/(rho c sdot) = 1300 K
;  (plan 12 section D, P-D3's exact case)
;
;  A 0.1 m line of 200 cells (constant properties, kinetics frozen) recedes at 1/700 m/s under
;  q_rad = 4e5 W/m2 (absorptivity 1, emissivity 0); 280 steps, a field file and seb.txt row a step.
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 280

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 0.0014285714285714286

[FUSS-IO]
sol-diter     = 1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
