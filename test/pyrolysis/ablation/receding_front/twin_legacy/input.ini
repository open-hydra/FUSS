; =============================================================================
;  Receding front, Robin wall, legacy remap (sweeps the cell state)
;  (plan 12 section D, P-D3's exact case)
;
;  twin_pyro without [FUSS-Pyrolysis] (legacy properties.dat): the legacy remap sweeps
;  the cell's own h, and T_w misses 1300 K by about 9 percent.
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 280

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 0.0014285714285714286

[FUSS-IO]
sol-diter     = 1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
