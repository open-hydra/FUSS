; =============================================================================
;  Receding front, Robin wall, pyrolysis remap (sweeps the wall state)
;  (plan 12 section D, P-D3's exact case)
;
;  front with hconv 400 W/m2/K to T_edge 2300 K instead of the flux (T_w* again 1300 K):
;  the pyrolysis remap sweeps T_w.
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 280

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 0.0014285714285714286

[FUSS-IO]
sol-diter     = 1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
