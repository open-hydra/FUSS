; =============================================================================
;  Ablating-wall guard demo base with pyrolysis  (plan 08 section 2.10; test/run_guard_demos.sh)
;
;  L 0.05 m in 20 equal cells, one cell across: 1-D. Face 2 is the ablating wall BC 306,
;  type-2 TACOT without kinetics, the toy B' table INPUT/bprime_demo.dat, chemistry on.
;  5 steps. The demos edit a copy; this base itself runs to completion.
;
;  Generated by test/pyrolysis/tools/make_abl_demo_base.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 5

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.3
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-Ablation]
seb-tol = 1.0e-8

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
