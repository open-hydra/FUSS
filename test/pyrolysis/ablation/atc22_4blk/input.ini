; Written by test/tools/split_blocks.py from test/pyrolysis/ablation/ATC22, cut into 4 x 1 blocks (only its FUSS sections are kept).
; set by --set: [FUSS-Parameters] time-threshold 10.0
; set by --set: [FUSS-IO] sol-dtime 0.5

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 10.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-IO]
sol-dtime     = 0.5
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
