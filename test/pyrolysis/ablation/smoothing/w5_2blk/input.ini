; =============================================================================
;  Wall smoothing (plan 08 sections 2.6, 3.6): a 2-D TACOT slab, 40 x 20 cells, the top face an ablating wall BC 306
;  whose rhoeUeCH0 varies with period four faces (env_hi.dat, env_lo.dat), law = nodeshift, 20 s; smoothing-width 5, two blocks.
;
;  Generated by ../generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 20.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
smoothing-width = 5

[FUSS-IO]
sol-dtime     = 5.0
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
