; =============================================================================
;  Uniform slab receding at a forced rate: the pyrolysis remap is exact on it  (plan 08 section 2.9, gate V2)
;
;  sealed_nosource (type 2) with the TACOT kinetics at a uniform 300 K, below every reaction threshold (the rates are
;  zero, the reactive masses are not), face 2 an ablating wall BC 306 with the chemistry off, hconv 0 and zero optics,
;  open at p_w = p-init: no flux anywhere. The face recedes at the TEST ONLY sdot-override of 1e-5 m/s (law
;  nodeshift) for 50 steps; the state must stay uniform and the totals scale with (L - s)/L.
;
;  Generated by generate.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 50

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-08
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = false
pi-source = 0

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
sdot-override = 1.0e-5

[FUSS-IO]
sol-diter     = 10
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
