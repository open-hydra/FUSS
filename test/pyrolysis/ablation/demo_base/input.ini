; =============================================================================
;  Ablating-wall guard demo base  (plan 08 section 2.10; test/run_guard_demos.sh)
;
;  L 0.05 m in 20 equal cells, one cell across: 1-D. Face 2 is the ablating wall BC 306,
;  kinematic mode (no pyrolysis): legacy material k 1, rho 1000, cp 1000; chemistry off.
;  5 steps. The demos edit a copy; this base itself runs to completion.
;
;  Generated by test/pyrolysis/tools/make_abl_demo_base.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 5

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.3
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Ablation]
seb-tol = 1.0e-8

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
