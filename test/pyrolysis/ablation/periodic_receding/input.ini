[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1.0e6
iter-threshold = 20

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.25
time-accurate = true
integration-variables = cons

[FUSS-MeshMotion]
law = nodeshift

[FUSS-Ablation]
smoothing-width = 5

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0
tol = 1.0e-10

[FUSS-IO]
sol-diter     = 20
sol-overwrite = true
sol-format    = tecplot ascii
res-diter = 1
shell-diter = 50
ini-diter = 100000000
