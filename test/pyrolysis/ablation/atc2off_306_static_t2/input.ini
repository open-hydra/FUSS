; =============================================================================
;  Ablation Test Case 2, chemistry off, face 2 as the ablating wall BC 306  (plan 08, gate 3.1 (a))
;
;  The atc2off case with two edits: the emissivity and absorptivity columns (7 and 8) of
;  virgin.dat and char.dat set to 0, and face 2 a BC 306 face whose env table INPUT/env_off.dat
;  keeps the chemistry off with hconv 300 W/m2/K and T_edge 2800 K. The 306 routine then hands
;  the face to the BC 303 kernel: every output but the wall file matches the unmodified case.
;
;  Type-2 gas closure (plan 07): the gas pressure is solved ([FUSS-Darcy]), the gas storage
;  eps_pg (rho_g h_g - p) is in E, the gas leaves through the open faces at p-wall.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 60.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
p-init = 101325.0
p-wall = 101325.0

[FUSS-IO]
sol-dtime     = 10.0
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = d01lo
probe2 = d01hi
probe3 = d02lo
probe4 = d02hi
probe5 = d04lo
probe6 = d04hi
probe7 = d08lo
probe8 = d08hi
probe9 = d12lo
probe10 = d12hi
probe11 = d16lo
probe12 = d16hi
probe13 = d24lo
probe14 = d24hi
probe15 = back

