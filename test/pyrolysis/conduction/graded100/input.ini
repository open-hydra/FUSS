; =============================================================================
;  Pure conduction on the pyrolysis path, constant properties, step-heated face 2 and insulated
;  face 1; oracle: the exact slab series (verify.py)
;
;  L of 0.05 m, 100 cells graded 0.1 toward the heated face 2.
;  Face 2 held at 1644 K from t equal 0 through Tw_time.dat (BC 302, a step); face 1 adiabatic
;  (BC 301); T(0) at 298 K; the kinetics stripped from pyrolysis.dat (every nPyroReac 0).
;  Two probes bracket each depth of ATC1 (see probes.json); verify.py interpolates in x and
;  in time.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 60.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 10.0
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = d01lo
probe2 = d01hi
probe3 = d02lo
probe4 = d02hi
probe5 = d04lo
probe6 = d04hi
probe7 = d08lo
probe8 = d08hi
probe9 = d16lo
probe10 = d16hi
probe11 = back

[d01lo]
index-position = 1 93 1 1
variables = T
dtime = 0.1

[d01hi]
index-position = 1 94 1 1
variables = T
dtime = 0.1

[d02lo]
index-position = 1 86 1 1
variables = T
dtime = 0.1

[d02hi]
index-position = 1 87 1 1
variables = T
dtime = 0.1

[d04lo]
index-position = 1 76 1 1
variables = T
dtime = 0.1

[d04hi]
index-position = 1 77 1 1
variables = T
dtime = 0.1

[d08lo]
index-position = 1 61 1 1
variables = T
dtime = 0.1

[d08hi]
index-position = 1 62 1 1
variables = T
dtime = 0.1

[d16lo]
index-position = 1 41 1 1
variables = T
dtime = 0.1

[d16hi]
index-position = 1 42 1 1
variables = T
dtime = 0.1

[back]
index-position = 1 1 1 1
variables = T
dtime = 0.1
