; =============================================================================
;  Steady gas mass balance on a 1-D line  (plan 07, gate 4.1(b2))
;
;  100 cells x 0.0005 m, face 1 sealed (BC 301, q 0), face 2 open (BC 303, hconv 0,
;  qrad 0, Tref 1000, p_w 101325 Pa), constant gas production pi-source 0.1 kg/m3/s,
;  K 1e-11 m2, constant synthetic gas, isothermal solid tables, T(0) at 1000 K, 2 s
;  time-accurate. At steady state the mass flux through the face at x is pi x
;  (verify.py rebuilds the face fluxes from OUTPUT/field.tec).
;
;  Generated by test/pyrolysis/tools/make_darcy_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 2.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-08
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = false
pi-source = 0.1

[FUSS-IO]
sol-dtime     = 0.1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
