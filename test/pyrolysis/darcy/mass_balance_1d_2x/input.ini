; Written by test/tools/split_blocks.py from test/pyrolysis/darcy/mass_balance_1d_ny4, cut into 1 x 2 blocks (only its FUSS sections are kept).

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 2.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-08
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = false
pi-source = 0.1

[FUSS-IO]
sol-dtime     = 0.1
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
