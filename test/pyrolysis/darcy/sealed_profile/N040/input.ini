; =============================================================================
;  Analytic steady pressure profile  (plan 07, gate 4.2, grid N040)
;
;  40 cells x 0.00125 m, face 1 sealed, face 2 open at p_w 101325 Pa, pi-source 0.1,
;  K 1e-13 m2, constant gas (M 0.022, mu 4e-5, h 0), solid cp 1e12 (T frozen at 1000 K),
;  quasi-steady: each material step is one Picard iteration on the lagged Gamma(p), run
;  until p is stationary (400 steps or the residual stop). Exact:
;  p^2 = p_w^2 + (pi R T mu/(W K)) (L^2 - x^2); verify.py fits the order over the grids.
;
;  Generated by test/pyrolysis/tools/make_darcy_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-10
time-threshold = 1e30
iter-threshold = 400

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-13
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = true
pi-source = 0.1

[FUSS-IO]
sol-dtime     = 1e30
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
