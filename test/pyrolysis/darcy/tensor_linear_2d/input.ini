; =============================================================================
;  Orthotropic permeability on a 2-D square  (plan 07, gate 4.3)
;
;  20 x 20 cells, four open faces (BC 303, hconv 0, qrad 0, Tref 300) each with
;  its own p_w on p^2 = p0^2 + a x (p0 101325 Pa, a 2e+11 Pa^2/m), K R diag(1e-13, 1e-15) R^T, R the 45-degree rotation, no gas source,
;  quasi-steady, solver pseudo (open faces in two index directions), tol 1e-13; the solid cp of
;  1e12 freezes T. Exact: p^2 linear in x, u_y/u_x = K_yx/K_xx in every cell (verify.py).
;
;  Generated by test/pyrolysis/tools/make_darcy_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-10
time-threshold = 1e30
iter-threshold = 200

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = pseudo
tol = 1e-13
max-iter = 1000000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = true
pi-source = 0
pseudo-vnn = 0.25

[FUSS-IO]
sol-dtime     = 1e30
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
