; Written by test/tools/split_blocks.py from test/pyrolysis/darcy/tensor_linear_2d, cut into 2 x 2 blocks (only its FUSS sections are kept).
; set by --set: [FUSS-Parameters] res-threshold 1e-30
; set by --set: [FUSS-Parameters] iter-threshold 9

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 1e30
iter-threshold = 9

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = pseudo
tol = 1e-13
max-iter = 1000000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = true
pi-source = 0
pseudo-vnn = 0.25

[FUSS-IO]
sol-dtime     = 1e30
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
