; =============================================================================
;  Sealed, source-free slab under the type-2 gas closure  (plan 07, gate 4.1(a))
;
;  100 cells x 0.0005 m, both i-faces impermeable (BC 301, q 0), no gas source, T(0) at
;  1000 K, up to 200 material steps (the run ends at its first step: nothing moves and the
;  convergence residual is exactly zero). The pressure must stay at p-init to round-off and every
;  face flux at zero (verify.py reads OUTPUT/field.tec and OUTPUT/darcy.txt).
;
;  Generated by test/pyrolysis/tools/make_darcy_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-22
time-threshold = 1e30
iter-threshold = 200

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-08
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = false
pi-source = 0

[FUSS-IO]
sol-dtime     = 1e30
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000
