; =============================================================================
;  Uniform adiabatic slab: the state follows the exact type-1 ODE, the gas leaving at h_pg(T)
;  (verify.py)
;
;  4 cells x 1 mm, both i-faces adiabatic (BC 301, q 0), T(0) at 1000 K, tables unchanged,
;  20 s with a field file every 0.5 s, no probes. Nothing varies along i, so every cell
;  follows the zero-dimensional decomposition ODE that verify.py integrates.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 20.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 0.5
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
