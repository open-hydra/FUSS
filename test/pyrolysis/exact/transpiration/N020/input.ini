[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 3546.24142748182
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-12
max-iter = 100000
p-init = 151987.5
p-wall = 101325.0
quasi-steady = false

[FUSS-IO]
sol-dtime     = 886.560356870456
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
