; =============================================================================
;  Transient gas pressure in a sealed/open porous slab, small amplitude (exact: darcy_exact.py 1)
;  20 cells, K 3.38374e-16 m2, D = K p0/(eps mu) = 1.42857e-06 m2/s = 1 alpha, p_w - p0 = 1 Pa,
;  T0 298.15 K (h_g = 0), to 875 s = 0.5 L^2/D, vnn 0.5
;
;  Generated by test/pyrolysis/tools/make_exact_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 875
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-12
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
quasi-steady = false

[FUSS-IO]
sol-dtime     = 35
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
