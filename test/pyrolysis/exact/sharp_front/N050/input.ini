; =============================================================================
;  Decomposition front with gas transpiration through the char (exact: darcy_exact.py 3)
;  50 cells, T0 300 K, surface 1200 K (302) from t = 0, instant decomposition at Tp 600 K (A 1e+09, E 0),
;  rho_v 280 -> rho_c 220, closure type2, K_c 1e-11, K_v 1e-18, lam 0.59631821, to 30 s
;
;  Generated by test/pyrolysis/tools/make_exact_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 30
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type2

[FUSS-Darcy]
solver = tridiag
tol = 1e-10
max-iter = 100000
p-init = 101325.0
p-wall = 101325.0
open-bc-types = 302
quasi-steady = false

[FUSS-IO]
sol-dtime     = 0.5
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
