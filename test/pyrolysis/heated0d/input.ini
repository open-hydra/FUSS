; =============================================================================
;  Uniform slab heated by a volumetric source q: the state follows the exact type-1 ODE
;  (verify.py)
;
;  4 cells x 1 mm, both i-faces adiabatic (BC 301, zero flux), T(0) at 300 K, tables
;  unchanged, qvol 3.75e+08 W/m3 in every cell from INPUT/st.tec, 3 s with a field file
;  every 0.05 s, no probes. Nothing varies along i, so every cell follows the
;  zero-dimensional decomposition ODE with the source that verify.py integrates.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 3.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.00625
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 0.05
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter     = 100000000
