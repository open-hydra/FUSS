; =============================================================================
;  Energy and mass audit on the real TACOT tables  (plan 06, gate 4.3)
;
;  40 cells x 1 mm, face 2 ramped 300 -> 1644 K in 1 s through Tw_time.dat (BC 302), face 1
;  adiabatic (BC 301), 10 s. verify.py closes the energy and solid-mass balances from
;  energy-budget.txt and the field file, and compares the probe series across vnn.
;
;  Generated by test/pyrolysis/tools/make_case.py -- edit that, not this.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
time-threshold = 10.0
iter-threshold = 100000000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = true
integration-variables = cons
irs = false

[FUSS-Pyrolysis]
gas-closure = type1
outflow-direction = +i
p-gas = 101325.0

[FUSS-IO]
sol-dtime     = 10.0
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000000

[FUSS-Probes]
probe1 = p05mm
probe2 = p15mm
probe3 = p35mm
probe4 = p75mm

[p05mm]
index-position = 1 40 1 1
variables = T
dtime = 0.1

[p15mm]
index-position = 1 39 1 1
variables = T
dtime = 0.1

[p35mm]
index-position = 1 37 1 1
variables = T
dtime = 0.1

[p75mm]
index-position = 1 33 1 1
variables = T
dtime = 0.1
