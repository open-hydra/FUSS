[FUSS-Parameters]
newrun = true
res-threshold = 1e-8
iter-threshold = 1500000

[FUSS-Numerics]
time-scheme = RK3
vnn = 1.0
time-accurate = false
integration-variables = cons
irs = false

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 100000000
res-diter = 100
shell-diter = 1000
