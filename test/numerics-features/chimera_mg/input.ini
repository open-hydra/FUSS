[FUSS-Parameters]
newrun = true
res-threshold = 1e-8

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = false
integration-variables = cons
irs = false

[FUSS-Multigrid]
levels = 3
cycle = v
level1-iter = 1000000
level2-iter = 2000
level3-iter = 2000

[FUSS-IO]
sol-diter     = 10000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 1000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.56
height = 0.1
nx = 112
ny = 16
strx = U 1.0
stry = U 1.0

[GRIB-Block2]
pivot = 0.47 0.0 0.0
length = 0.53
height = 0.1
nx = 104
ny = 12
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = mat1
cp  = 450.0
rho = 8000.0
k   = 10.0
Tmax = 3000

;

[ICB-Block1]
type = homogeneous
material = mat1
T = 1500.0

[ICB-Block2]
type = homogeneous
material = mat1
T = 1500.0

;

[ATLAS-Parameters]
BC-chimera = true
MG-levels = 3

[BCB-Block1]
face1 = Twall-cold
face2 = chimera
face3 = null
face4 = Twall-top
face5 = null
face6 = null

[BCB-Block2]
face1 = chimera
face2 = Twall-hot
face3 = null
face4 = Twall-top
face5 = null
face6 = null

[Twall-hot]
type = wall
T = 2000.0

[Twall-cold]
type = wall
T = 1000.0

[Twall-top]
type = wall
T = 1200.0
