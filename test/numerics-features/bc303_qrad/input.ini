; =============================================================================
;  NAFEMS T4 plate with a NON-ZERO radiative heat flux on the convective faces
;  Gate for the BC 303 radiative flux.
;
;  Inputs of ../../steady-state/convective_Plate except that every type-303 face carries
;  qrad = 1.0e4 W/m^2 (third parameter on bc.txt line 2 is hconv, qrad, Tref).
;  The gate (verify.py) is the wall relation the BC itself defines:
;      qw - hconv*(Tref - Tw) == qrad     on every 303 face point,
;  which is exact to round-off, needs no analytic solution, and holds at EVERY
;  step (it is the BC's own definition), so the run is cut to 200 iterations
;  instead of converging the NAFEMS case (seconds, not minutes). Until this was
;  fixed the dispatch passed the never-assigned bc%qw instead of bc%qrad, so
;  qrad had NO effect and this relation gave 0 instead of 1e4 (proven red on
;  the 6cad426 binary, then green with the one-token fix).
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
iter-threshold = 200

[FUSS-Numerics]
time-scheme = RK3
vnn = 2.0
time-accurate = false
integration-variables = prim
irs = true
irs-beta = 0.5

[FUSS-IO]
sol-diter     = 200
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 1000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.6
height = 1.0
nx = 60
ny = 100
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = mat
cp  = 460.0
rho = 7850.0
k   = 52.0
Tmax = 1000

;

[ICB-Block1]
type = homogeneous
material = mat
T = 373.15

;

[BCB-Block1]
face1 = adiabatic
face2 = convection
face3 = Twall
face4 = convection
face5 = null
face6 = null

[adiabatic]
type = wall
q = 0.0

[convection]
type = wall
hconv = 750.0
Tref  = 273.15
qrad  = 0.0

[Twall]
type = wall
T = 373.15
