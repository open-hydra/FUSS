; =============================================================================
;  One-dimensional slab with a closed form for BC 303 (plan 10, D14)
;
;  Generated by generate.py -- edit that, not this.
;
;  Face 1 at T0 = 300 K (302), face 2 BC 303 with hconv = 100, qrad = 10000,
;  Tref = 1000; k = 10 W/m/K, L = 0.1 m. Steady and linear:
;
;      T_w = (k T0/L + h Tref + qrad) / (k/L + h) = 700.000000 K
;      q_w = k (T_w - T0)/L                       = 40000.000000 W/m2
;
;  verify.py checks the interior against T(x) (the flux site of the 303 dispatch)
;  and the wall output's Tw, qw (its output site).
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-10

[FUSS-Numerics]
time-scheme = RK3
vnn = 2.0
time-accurate = false
integration-variables = cons
irs = true
irs-beta = 0.5

[FUSS-IO]
sol-diter     = 100000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.1
height = 0.02
nx = 20
ny = 4
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = slab
cp  = 1000.0
rho = 1000.0
k   = 10.0
Tmax = 2000

;

[ICB-Block1]
type = homogeneous
material = slab
T = 300.0

;

[BCB-Block1]
face1 = Twall
face2 = convection
face3 = adiabatic
face4 = adiabatic
face5 = null
face6 = null

[Twall]
type = wall
T = 300.0

[convection]
type = wall
hconv = 100.0
Tref  = 1000.0
qrad  = 10000.0

[adiabatic]
type = wall
q = 0.0
