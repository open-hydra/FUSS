; =============================================================================
;  Conjugate two-layer slab with UNEQUAL cell spacing across the interface
;  (plan 10, D4)
;
;  Generated by generate.py -- edit that, not this.
;
;  Two blocks, two materials, and dx2/dx1 = 4. The steady solution is
;  piecewise linear and therefore exactly representable on this grid, so the
;  expected error is round-off and any interface mistreatment shows up as a
;  kink rather than as a tolerance argument.
;
;      q     = (Thot - Tcold) / (L1/k1 + L2/k2) = 31818.181818 W/m2
;      T_int = 936.363636 K
;
;  Every other multi-block case in the suite has matched spacing across its
;  interfaces, which is exactly the configuration in which using the wrong
;  side's metric is invisible. See ../../../test/run_regression.sh history and
;  plan 10 D4.
; =============================================================================

[FUSS-Parameters]
newrun = true
res-threshold = 1e-10

[FUSS-Numerics]
time-scheme = RK3
vnn = 2.0
time-accurate = false
integration-variables = cons
irs = true
irs-beta = 0.5

[FUSS-IO]
sol-diter     = 100000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter     = 100000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.1
height = 0.02
nx = 20
ny = 4
strx = U 1.0
stry = U 1.0

[GRIB-Block2]
pivot = 0.1 0.0 0.0
length = 0.1
height = 0.02
nx = 5
ny = 4
strx = U 1.0
stry = U 1.0

;

[GPB-Phase1]
type = solid
material = layerA layerB
cp  = 1000.0 1000.0
rho = 1000.0 1000.0
k   = 50.0 5.0
Tmax = 2000

;

[ICB-Block1]
type = homogeneous
material = layerA
T = 300.0

[ICB-Block2]
type = homogeneous
material = layerB
T = 300.0

;

[BCB-Block1]
face1 = Twall-hot
face2 = connection
face3 = adiabatic
face4 = adiabatic
face5 = null
face6 = null

[BCB-Block2]
face1 = connection
face2 = Twall-cold
face3 = adiabatic
face4 = adiabatic
face5 = null
face6 = null

[Twall-hot]
type = wall
T = 1000.0

[Twall-cold]
type = wall
T = 300.0

[adiabatic]
type = wall
q = 0.0
