[FUSS-Parameters]
newrun = true
res-threshold = 1e-8
iter-threshold = 400000

[FUSS-Numerics]
time-scheme = RK3
vnn = 2.0
time-accurate = false
integration-variables = cons
irs = true
irs-beta = 0.5

[FUSS-Multigrid]
levels = 3
level1-iter = 1000000
level2-iter = 1
level3-iter = 1
cycle = w
coarse-iter = 10

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 100000000
res-diter = 100
shell-diter = 1000
