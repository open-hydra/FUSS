; Time step of 3-D cells skewed in all three pairs of directions: MESH/ and INPUT/ come from make_inputs.py, not ATLAS

[FUSS-Parameters]
newrun = true
res-threshold = 1e-30
iter-threshold = 1

[FUSS-Numerics]
time-scheme = euler
vnn = 0.4
time-accurate = false
integration-variables = cons

[FUSS-IO]
sol-diter     = 1
sol-overwrite = true
sol-format    = tecplot ascii
res-diter = 1
shell-diter = 1
ini-diter = 100000000
