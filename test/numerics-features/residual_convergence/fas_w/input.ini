[FUSS-Parameters]
newrun = true
res-threshold = 1e-8

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.25
time-accurate = false
integration-variables = cons

[FUSS-Multigrid]
levels = 2
cycle = w
level1-iter = 1000000
level2-iter = 1

[FUSS-IO]
sol-diter     = 10000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 1000
