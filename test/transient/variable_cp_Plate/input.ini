; variable_cp_Plate: uniform heating of an adiabatic plate whose specific heat depends on temperature
; (cp linear in T, from 420 J/(kg K) at 300 K to about 830 at 1320 K: make_properties.py writes INPUT/properties.dat).
; Every wall is adiabatic and the source is uniform, so T stays uniform and obeys rho cp(T) dT/dt equal to qvol:
; the integral of rho cp from T0 to T equals qvol t, which verify.py solves in closed form. The test checks the
; heat capacity of the integration path (prim: rho cp dT/dt; cons: dh/dt with h the Energy column).

[FUSS-Parameters]
newrun = true
time-threshold = 100.0

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.4
time-accurate = true
integration-variables = prim

[FUSS-IO]
sol-diter     = 5
sol-overwrite = false
sol-format    = tecplot ascii
ini-diter = 1000

;

[GRIB-meshgen]
outpath = MESH/
method = fmsh
type = 2Dplane
width = 0.01

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.6
height = 0.4
nx = 60
ny = 40
strx = U 1.0
stry = U 1.0

; GPB-Phase1 gives ICB and BCB the phase type and the material name only. Do not run GPB here: it writes
; constant-property tables, while INPUT/properties.dat (cp linear in T) comes from make_properties.py.
[GPB-Phase1]
type = solid
material = mat

[ICB-Block1]
type = homogeneous
material = mat
T = 300.0

[STB-Block1]
qvol = 5.e7

;

[BCB-Block1]
face1 = adiabatic
face2 = adiabatic
face3 = adiabatic
face4 = adiabatic
face5 = null
face6 = null

[adiabatic]
type = wall
q = 0.0
