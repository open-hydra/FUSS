; Three material layers in series inside one block: MESH/ and INPUT/ come from make_inputs.py, not ATLAS

[FUSS-Parameters]
newrun = true
res-threshold = 1e-12
iter-threshold = 400000

[FUSS-Numerics]
time-scheme = RK3
vnn = 0.5
time-accurate = false
integration-variables = cons

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 100000000
res-diter = 100
shell-diter = 10000
