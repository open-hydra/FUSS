; Linear patch test on a 45 deg sheared plate: MESH/ and INPUT/ come from make_inputs.py, not ATLAS

[FUSS-Parameters]
newrun = true
res-threshold = 1e-12
iter-threshold = 400000

[FUSS-Numerics]
time-scheme = RK3
vnn = 2.0
time-accurate = false
integration-variables = prim
irs-beta = 0.5

[FUSS-IO]
sol-diter     = 100000000
sol-overwrite = true
sol-format    = tecplot ascii
ini-diter = 100000000
